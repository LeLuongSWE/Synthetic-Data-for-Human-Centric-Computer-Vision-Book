<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17233b}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.xs{font-size:12px}.b{font-weight:700}.muted{fill:#667085}.blue{fill:#2563eb}.green{fill:#16a34a}.red{fill:#dc2626}.purple{fill:#7c3aed}.orange{fill:#ea580c}.axis{stroke-width:4;fill:none}.thin{stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.card{fill:#fff;stroke:#d6dbe6;stroke-width:2}.note{fill:#fff7d6;stroke:#f0c94f;stroke-width:2}</style><rect width="800" height="600" fill="white"/><defs><marker id="vg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#16a34a"/></marker></defs><text x="400" y="45" text-anchor="middle" class="title">Điểm khác vector như thế nào?</text><rect x="55" y="95" width="320" height="280" rx="16" class="card"/><rect x="425" y="95" width="320" height="280" rx="16" class="card"/><rect x="55" y="95" width="320" height="48" rx="16" fill="#dbeafe"/><rect x="425" y="95" width="320" height="48" rx="16" fill="#dcfce7"/><text x="215" y="128" text-anchor="middle" class="h blue">Điểm</text><text x="585" y="128" text-anchor="middle" class="h green">Vector</text><circle cx="230" cy="230" r="9" fill="#2563eb"/><text x="250" y="225" class="h blue">P = (1, 2, 3)</text><text x="215" y="330" text-anchor="middle" class="s blue b">mô tả vị trí</text><line x1="495" y1="290" x2="665" y2="205" stroke="#16a34a" stroke-width="8" marker-end="url(#vg)"/><text x="580" y="190" text-anchor="middle" class="h green">v = (3, 1, 0)</text><text x="585" y="330" text-anchor="middle" class="s green b">mô tả hướng và độ lớn</text><text x="400" y="420" text-anchor="middle" class="h">Ví dụ</text><circle cx="210" cy="485" r="8" fill="#2563eb"/><circle cx="590" cy="485" r="8" fill="#2563eb"/><line x1="220" y1="485" x2="575" y2="485" stroke="#16a34a" stroke-width="6" marker-end="url(#vg)"/><text x="210" y="463" text-anchor="middle" class="s blue b">A = (1, 2, 3)</text><text x="590" y="463" text-anchor="middle" class="s blue b">B = (4, 3, 3)</text><text x="400" y="470" text-anchor="middle" class="s green b">B - A = (3, 1, 0)</text><rect x="300" y="525" width="200" height="48" rx="12" fill="#eff6ff" stroke="#2563eb"/><text x="400" y="556" text-anchor="middle" class="h">A + v = B</text></svg>