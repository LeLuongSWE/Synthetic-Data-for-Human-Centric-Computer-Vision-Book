<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs><marker id="unitArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="900" rx="26" fill="#eaf4ff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#12345b">Đơn vị phải được khai báo</text>
  <rect x="175" y="92" width="850" height="58" rx="18" fill="#fff8dc" stroke="#d7b32d" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#3f4650">Không được suy ra đơn vị chỉ từ hình ảnh hoặc ba giá trị tọa độ</text>

  <rect x="70" y="190" width="430" height="520" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
  <text x="285" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#24558b">Mô hình trong Unity</text>
  <g fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round">
    <circle cx="270" cy="315" r="38" fill="#cfe4ff"/>
    <line x1="270" y1="353" x2="270" y2="485"/>
    <line x1="270" y1="390" x2="210" y2="450"/>
    <line x1="270" y1="390" x2="330" y2="450"/>
    <line x1="270" y1="485" x2="220" y2="610"/>
    <line x1="270" y1="485" x2="320" y2="610"/>
  </g>
  <line x1="150" y1="275" x2="150" y2="620" stroke="#d95516" stroke-width="5"/>
  <line x1="135" y1="275" x2="165" y2="275" stroke="#d95516" stroke-width="5"/>
  <line x1="135" y1="620" x2="165" y2="620" stroke="#d95516" stroke-width="5"/>
  <text x="115" y="460" text-anchor="middle" transform="rotate(-90 115 460)" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#9a3412">1,75 Unity unit</text>
  <text x="285" y="675" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#64748b">Tỉ lệ trong cảnh chỉ là dữ kiện.</text>

  <line x1="515" y1="450" x2="570" y2="450" stroke="#2563eb" stroke-width="6" marker-end="url(#unitArrow)"/>
  <rect x="585" y="190" width="545" height="520" rx="24" fill="#f8fbff" stroke="#e8a56d" stroke-width="3"/>
  <text x="857" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#9a3412">Thông tin đi kèm tệp xuất</text>
  <g font-family="ui-monospace,monospace" font-size="21">
    <rect x="635" y="295" width="445" height="62" rx="14" fill="#fff3e8"/><text x="660" y="334" fill="#5c3a27">unity_unit_in_meters: 1.0</text>
    <rect x="635" y="375" width="445" height="62" rx="14" fill="#fff3e8"/><text x="660" y="414" fill="#5c3a27">person_height_units: 1.75</text>
    <rect x="635" y="455" width="445" height="62" rx="14" fill="#fff3e8"/><text x="660" y="494" fill="#5c3a27">coordinate_system: world</text>
    <rect x="635" y="535" width="445" height="62" rx="14" fill="#fff3e8"/><text x="660" y="574" fill="#5c3a27">scale_applied: [1, 1, 1]</text>
  </g>
  <text x="857" y="655" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#64748b">Có số đo + có cách hiểu số đo</text>

  <rect x="125" y="760" width="950" height="78" rx="20" fill="#ffe3e3" stroke="#ef8b8b" stroke-width="2"/>
  <text x="600" y="793" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">Nếu thiếu đơn vị</text>
  <text x="600" y="823" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#6d3434">Khoảng cách, vận tốc và kích thước cơ thể có thể sai cùng một hệ số.</text>
</svg>
