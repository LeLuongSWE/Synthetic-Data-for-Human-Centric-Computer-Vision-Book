<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs><marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="900" rx="26" fill="#eaf4ff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#12345b">Ma trận biến đổi 4 × 4</text>
  <rect x="180" y="92" width="840" height="58" rx="18" fill="#fff8dc" stroke="#d7b32d" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#3f4650">Gom phép xoay, thay đổi kích thước và dời vị trí vào một phép tính</text>

  <rect x="65" y="220" width="240" height="430" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
  <text x="185" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e40af">Điểm cục bộ</text>
  <text x="185" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎡ x ⎤</text>
  <text x="185" y="410" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎢ y ⎥</text>
  <text x="185" y="470" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎢ z ⎥</text>
  <text x="185" y="530" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎣ 1 ⎦</text>
  <text x="185" y="600" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#64748b">so với cha</text>

  <line x1="315" y1="435" x2="370" y2="435" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
  <rect x="385" y="190" width="430" height="490" rx="24" fill="#f8fbff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="600" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#5b21b6">M</text>
  <rect x="440" y="285" width="230" height="230" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
  <text x="555" y="390" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#5b21b6">xoay + scale</text>
  <text x="555" y="425" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#6d5f83">khối 3 × 3</text>
  <rect x="680" y="285" width="80" height="230" rx="10" fill="#ffeadf" stroke="#ea5f1b" stroke-width="3"/>
  <text x="720" y="385" text-anchor="middle" transform="rotate(-90 720 385)" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#9a3412">dời vị trí</text>
  <rect x="440" y="525" width="320" height="70" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="570" text-anchor="middle" font-family="ui-monospace,monospace" font-size="25" fill="#334155">0   0   0   1</text>
  <text x="600" y="640" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#64748b">một ma trận, nhiều phép biến đổi</text>

  <line x1="825" y1="435" x2="880" y2="435" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
  <rect x="895" y="220" width="240" height="430" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
  <text x="1015" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#166534">Điểm toàn cảnh</text>
  <text x="1015" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎡ x′ ⎤</text>
  <text x="1015" y="410" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎢ y′ ⎥</text>
  <text x="1015" y="470" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎢ z′ ⎥</text>
  <text x="1015" y="530" text-anchor="middle" font-family="ui-monospace,monospace" font-size="35" fill="#24364b">⎣ 1  ⎦</text>
  <text x="1015" y="600" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#64748b">so với toàn cảnh</text>

  <rect x="130" y="760" width="940" height="78" rx="20" fill="#ffe9dc" stroke="#f2a36d" stroke-width="2"/>
  <text x="600" y="805" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="650" fill="#9a3412">Đổi thứ tự nhân ma trận có thể làm kết quả thay đổi.</text>
</svg>
