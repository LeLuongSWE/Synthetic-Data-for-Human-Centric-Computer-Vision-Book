<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="900" rx="26" fill="#eaf4ff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#12345b">Một hướng quay, hai cách lưu</text>
  <rect x="165" y="92" width="870" height="58" rx="18" fill="#fff8dc" stroke="#d7b32d" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#3f4650">Hướng cuối có thể giống nhau dù các con số và ý nghĩa khác nhau</text>

  <rect x="70" y="190" width="440" height="515" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
  <text x="290" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#5b21b6">Hướng cuối cùng</text>
  <circle cx="290" cy="440" r="150" fill="#f0eaff" stroke="#8b5cf6" stroke-width="5"/>
  <line x1="290" y1="440" x2="405" y2="325" stroke="#7c3aed" stroke-width="12" marker-end="url(#violet)"/>
  <path d="M155 465A142 142 0 0 1 267 300" fill="none" stroke="#a78bfa" stroke-width="9" marker-end="url(#violet)"/>
  <circle cx="290" cy="440" r="12" fill="#5b21b6"/>
  <text x="290" y="645" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" fill="#475569">Một tư thế quan sát được</text>

  <rect x="555" y="190" width="575" height="225" rx="24" fill="#eef5ff" stroke="#61a5ee" stroke-width="3"/>
  <circle cx="610" cy="245" r="27" fill="#2563eb"/><text x="610" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="white">A</text>
  <text x="660" y="250" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#1e40af">Euler angles</text>
  <text x="610" y="315" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="650" fill="#334155">(α, β, γ)</text>
  <text x="610" y="365" font-family="Inter,Arial,sans-serif" font-size="22" fill="#475569">Ba góc, phải biết thứ tự và trục quay.</text>

  <rect x="555" y="450" width="575" height="255" rx="24" fill="#f0fbf4" stroke="#4ac979" stroke-width="3"/>
  <circle cx="610" cy="505" r="27" fill="#16a34a"/><text x="610" y="514" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="white">B</text>
  <text x="660" y="510" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#166534">Quaternion</text>
  <text x="610" y="575" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="650" fill="#334155">(x, y, z, w)</text>
  <text x="610" y="625" font-family="Inter,Arial,sans-serif" font-size="22" fill="#475569">Bốn số, nhưng không phải bốn góc.</text>
  <text x="610" y="665" font-family="Inter,Arial,sans-serif" font-size="21" fill="#64748b">Thường ổn định hơn khi nội suy chuyển động.</text>

  <rect x="125" y="760" width="950" height="78" rx="20" fill="#ffe9dc" stroke="#f2a36d" stroke-width="2"/>
  <text x="600" y="793" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">Dataset phải ghi rõ</text>
  <text x="600" y="823" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#67402d">Cách biểu diễn • thứ tự trục • hệ tọa độ</text>
</svg>
