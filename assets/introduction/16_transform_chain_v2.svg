  <defs><marker id="chainArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2f6fbd"/></marker></defs>
  <rect width="1200" height="900" rx="26" fill="#eaf4ff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#12345b">Chuỗi biến đổi cha–con</text>
  <rect x="170" y="92" width="860" height="58" rx="18" fill="#fff8dc" stroke="#d7b32d" stroke-width="2"/>
