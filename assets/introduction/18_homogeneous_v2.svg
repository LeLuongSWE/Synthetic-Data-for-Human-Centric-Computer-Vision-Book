<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="pointArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
    <marker id="dirArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="900" rx="26" fill="#eaf4ff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700" fill="#12345b">Giá trị thứ tư phân biệt điểm và hướng</text>
  <rect x="100" y="92" width="1000" height="58" rx="18" fill="#fff8dc" stroke="#d7b32d" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#3f4650">Cùng ba số đầu, nhưng w quyết định phép dời vị trí có tác động hay không</text>

  <rect x="70" y="190" width="510" height="520" rx="24" fill="#f8fbff" stroke="#68a7ed" stroke-width="3"/>
  <circle cx="125" cy="245" r="27" fill="#2563eb"/><text x="125" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text>
  <text x="180" y="253" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#1e40af">Điểm: (x, y, z, 1)</text>
  <circle cx="185" cy="455" r="30" fill="#2563eb"/>
  <line x1="230" y1="455" x2="420" y2="355" stroke="#2563eb" stroke-width="9" marker-end="url(#pointArrow)"/>
  <circle cx="445" cy="340" r="30" fill="#2563eb"/>
  <text x="315" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" fill="#334155">P → P + t</text>
  <rect x="120" y="585" width="410" height="70" rx="17" fill="#e5f0ff"/>
  <text x="325" y="628" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#31587f">Phép dời vị trí làm điểm chuyển chỗ.</text>

  <rect x="620" y="190" width="510" height="520" rx="24" fill="#f8fbff" stroke="#4ac979" stroke-width="3"/>
  <circle cx="675" cy="245" r="27" fill="#16a34a"/><text x="675" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text>
  <text x="730" y="253" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#166534">Hướng: (x, y, z, 0)</text>
  <line x1="720" y1="400" x2="960" y2="305" stroke="#16a34a" stroke-width="9" marker-end="url(#dirArrow)"/>
  <line x1="720" y1="500" x2="960" y2="405" stroke="#16a34a" stroke-width="9" marker-end="url(#dirArrow)"/>
  <text x="875" y="555" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" fill="#334155">v → v</text>
  <rect x="670" y="585" width="410" height="70" rx="17" fill="#e5f8ea"/>
  <text x="875" y="615" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#2e6745">Dời gốc không đổi hướng;</text>
  <text x="875" y="643" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#2e6745">mũi tên chỉ được đặt ở vị trí khác.</text>

  <rect x="145" y="760" width="910" height="78" rx="20" fill="#efe8ff" stroke="#b69af2" stroke-width="2"/>
  <text x="600" y="805" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="650" fill="#5b21b6">w = 1: có vị trí   •   w = 0: chỉ có hướng và độ lớn</text>
</svg>
