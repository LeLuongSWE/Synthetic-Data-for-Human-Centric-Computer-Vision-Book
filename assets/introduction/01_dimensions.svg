<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17233b}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.xs{font-size:12px}.b{font-weight:700}.muted{fill:#667085}.blue{fill:#2563eb}.green{fill:#16a34a}.red{fill:#dc2626}.purple{fill:#7c3aed}.orange{fill:#ea580c}.axis{stroke-width:4;fill:none}.thin{stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.card{fill:#fff;stroke:#d6dbe6;stroke-width:2}.note{fill:#fff7d6;stroke:#f0c94f;stroke-width:2}</style><rect width="800" height="600" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#17233b"/></marker></defs><text x="400" y="45" text-anchor="middle" class="title">Không gian 1 chiều, 2 chiều, 3 chiều</text><text x="400" y="73" text-anchor="middle" class="s muted">Số chiều = số hướng đo độc lập</text><rect x="35" y="105" width="230" height="400" rx="18" class="card"/><rect x="55" y="125" width="190" height="46" rx="12" fill="#dbeafe"/><text x="150" y="156" text-anchor="middle" class="h">1 chiều</text><rect x="285" y="105" width="230" height="400" rx="18" class="card"/><rect x="305" y="125" width="190" height="46" rx="12" fill="#dcfce7"/><text x="400" y="156" text-anchor="middle" class="h">2 chiều</text><rect x="535" y="105" width="230" height="400" rx="18" class="card"/><rect x="555" y="125" width="190" height="46" rx="12" fill="#ede9fe"/><text x="650" y="156" text-anchor="middle" class="h">3 chiều</text><line x1="75" y1="285" x2="225" y2="285" stroke="#17233b" stroke-width="3" marker-end="url(#a)"/><line x1="105" y1="276" x2="105" y2="294" stroke="#17233b"/><text x="105" y="316" text-anchor="middle" class="s">0</text><circle cx="185" cy="285" r="7" fill="#2563eb"/><text x="185" y="268" text-anchor="middle" class="s blue b">P</text><text x="150" y="382" text-anchor="middle" class="s">Một điểm cần 1 số</text><text x="150" y="420" text-anchor="middle" class="s blue b">Hướng đo: x</text><line x1="325" y1="220" x2="475" y2="220" stroke="#e5e7eb"/><line x1="325" y1="248" x2="475" y2="248" stroke="#e5e7eb"/><line x1="325" y1="276" x2="475" y2="276" stroke="#e5e7eb"/><line x1="325" y1="304" x2="475" y2="304" stroke="#e5e7eb"/><line x1="325" y1="332" x2="475" y2="332" stroke="#e5e7eb"/><line x1="325" y1="360" x2="475" y2="360" stroke="#e5e7eb"/><line x1="325" y1="220" x2="325" y2="360" stroke="#e5e7eb"/><line x1="355" y1="220" x2="355" y2="360" stroke="#e5e7eb"/><line x1="385" y1="220" x2="385" y2="360" stroke="#e5e7eb"/><line x1="415" y1="220" x2="415" y2="360" stroke="#e5e7eb"/><line x1="445" y1="220" x2="445" y2="360" stroke="#e5e7eb"/><line x1="475" y1="220" x2="475" y2="360" stroke="#e5e7eb"/><line x1="335" y1="345" x2="475" y2="345" stroke="#17233b" stroke-width="3" marker-end="url(#a)"/><line x1="350" y1="360" x2="350" y2="215" stroke="#17233b" stroke-width="3" marker-end="url(#a)"/><text x="478" y="367" class="s">x</text><text x="335" y="216" class="s">y</text><circle cx="430" cy="265" r="7" fill="#16a34a"/><text x="442" y="258" class="s green b">P(x,y)</text><text x="400" y="382" text-anchor="middle" class="s">Một điểm cần 2 số</text><text x="400" y="420" text-anchor="middle" class="s green b">Hướng đo: x, y</text><line x1="635" y1="355" x2="740" y2="355" stroke="#17233b" stroke-width="3" marker-end="url(#a)"/><line x1="635" y1="355" x2="635" y2="215" stroke="#17233b" stroke-width="3" marker-end="url(#a)"/><line x1="635" y1="355" x2="575" y2="405" stroke="#17233b" stroke-width="3" marker-end="url(#a)"/><text x="745" y="370" class="s">y</text><text x="620" y="215" class="s">z</text><text x="565" y="420" class="s">x</text><circle cx="695" cy="270" r="7" fill="#7c3aed"/><line x1="695" y1="270" x2="695" y2="355" stroke="#7c3aed" stroke-width="2" class="dash"/><line x1="695" y1="270" x2="635" y2="270" stroke="#7c3aed" stroke-width="2" class="dash"/><text x="705" y="257" class="s purple b">P(x,y,z)</text><text x="650" y="445" text-anchor="middle" class="s">Một điểm cần 3 số</text><text x="650" y="480" text-anchor="middle" class="s purple b">Hướng đo: x, y, z</text><text x="400" y="555" text-anchor="middle" class="s muted">Mỗi chiều bổ sung một hướng đo độc lập mới.</text></svg>