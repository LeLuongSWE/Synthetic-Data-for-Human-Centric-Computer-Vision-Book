<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17233b}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.xs{font-size:12px}.b{font-weight:700}.muted{fill:#667085}.blue{fill:#2563eb}.green{fill:#16a34a}.red{fill:#dc2626}.purple{fill:#7c3aed}.orange{fill:#ea580c}.axis{stroke-width:4;fill:none}.thin{stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.card{fill:#fff;stroke:#d6dbe6;stroke-width:2}.note{fill:#fff7d6;stroke:#f0c94f;stroke-width:2}</style><rect width="800" height="600" fill="white"/><text x="400" y="45" text-anchor="middle" class="title">Một điểm có thể có nhiều tọa độ</text><rect x="40" y="90" width="340" height="360" rx="18" class="card"/><rect x="75" y="110" width="270" height="42" rx="10" fill="#2563eb"/><text x="210" y="138" text-anchor="middle" style="fill:white;font-size:20px;font-weight:700">Hệ tọa độ A</text><text x="210" y="177" text-anchor="middle" class="s">Gốc ở tâm sân</text><rect x="85" y="205" width="250" height="165" rx="8" fill="#dcfce7" stroke="#86efac"/><line x1="210" y1="205" x2="210" y2="370" stroke="white" stroke-width="2"/><circle cx="210" cy="288" r="30" fill="none" stroke="white" stroke-width="2"/><circle cx="275" cy="250" r="12" fill="#f2c9a5"/><line x1="275" y1="262" x2="275" y2="315" stroke="#2563eb" stroke-width="14"/><line x1="275" y1="315" x2="261" y2="350" stroke="#17233b" stroke-width="7"/><line x1="275" y1="315" x2="289" y2="350" stroke="#17233b" stroke-width="7"/><circle cx="210" cy="288" r="5" fill="#2563eb"/><line x1="210" y1="288" x2="275" y2="325" stroke="#2563eb" stroke-width="2" class="dash"/><text x="210" y="410" text-anchor="middle" class="s b" style="fill:#2563eb">A = (2, 3, 1)</text><rect x="420" y="90" width="340" height="360" rx="18" class="card"/><rect x="455" y="110" width="270" height="42" rx="10" fill="#16a34a"/><text x="590" y="138" text-anchor="middle" style="fill:white;font-size:20px;font-weight:700">Hệ tọa độ B</text><text x="590" y="177" text-anchor="middle" class="s">Gốc ở góc sân</text><rect x="465" y="205" width="250" height="165" rx="8" fill="#dcfce7" stroke="#86efac"/><line x1="590" y1="205" x2="590" y2="370" stroke="white" stroke-width="2"/><circle cx="590" cy="288" r="30" fill="none" stroke="white" stroke-width="2"/><circle cx="655" cy="250" r="12" fill="#f2c9a5"/><line x1="655" y1="262" x2="655" y2="315" stroke="#2563eb" stroke-width="14"/><line x1="655" y1="315" x2="641" y2="350" stroke="#17233b" stroke-width="7"/><line x1="655" y1="315" x2="669" y2="350" stroke="#17233b" stroke-width="7"/><circle cx="475" cy="355" r="5" fill="#16a34a"/><line x1="475" y1="355" x2="655" y2="325" stroke="#16a34a" stroke-width="2" class="dash"/><text x="590" y="410" text-anchor="middle" class="s b" style="fill:#16a34a">B = (7, 8, 1)</text><rect x="155" y="480" width="490" height="42" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="400" y="507" text-anchor="middle" class="h blue">Cùng một điểm, tọa độ có thể khác nhau</text><rect x="210" y="535" width="380" height="38" rx="12" class="note"/><text x="400" y="560" text-anchor="middle" class="s b">Vật không đổi vị trí, chỉ đổi cách đo</text></svg>