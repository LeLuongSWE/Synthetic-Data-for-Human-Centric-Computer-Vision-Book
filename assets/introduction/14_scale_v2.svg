<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" rx="26" fill="#eaf4ff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" fill="#12345b">Thay đổi kích thước</text>
  <rect x="190" y="92" width="820" height="58" rx="18" fill="#fff8dc" stroke="#d7b32d" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#3f4650">So sánh kích thước ban đầu, đồng đều và không đồng đều</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="60" y="190" width="330" height="520" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
    <circle cx="105" cy="235" r="24" fill="#2563eb"/><text x="105" y="243" text-anchor="middle" font-size="20" font-weight="700" fill="white">1</text>
    <text x="225" y="245" text-anchor="middle" font-size="27" font-weight="700" fill="#2563eb">Ban đầu</text>
    <rect x="135" y="325" width="180" height="180" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <line x1="120" y1="535" x2="330" y2="535" stroke="#9fb4ca" stroke-width="3"/>
    <text x="225" y="585" text-anchor="middle" font-size="25" font-weight="650" fill="#334155">(1, 1, 1)</text>
    <text x="225" y="645" text-anchor="middle" font-size="21" fill="#64748b">Mốc so sánh</text>

    <rect x="435" y="190" width="330" height="520" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
    <circle cx="480" cy="235" r="24" fill="#16a34a"/><text x="480" y="243" text-anchor="middle" font-size="20" font-weight="700" fill="white">2</text>
    <text x="600" y="245" text-anchor="middle" font-size="27" font-weight="700" fill="#159447">Đồng đều</text>
    <rect x="485" y="275" width="230" height="230" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <line x1="470" y1="535" x2="730" y2="535" stroke="#9fb4ca" stroke-width="3"/>
    <text x="600" y="585" text-anchor="middle" font-size="25" font-weight="650" fill="#166534">(2, 2, 2)</text>
    <text x="600" y="645" text-anchor="middle" font-size="21" fill="#166534">Giữ nguyên tỉ lệ</text>

    <rect x="810" y="190" width="330" height="520" rx="24" fill="#f8fbff" stroke="#b8d2ed" stroke-width="3"/>
    <circle cx="855" cy="235" r="24" fill="#df641e"/><text x="855" y="243" text-anchor="middle" font-size="20" font-weight="700" fill="white">3</text>
    <text x="1008" y="245" text-anchor="middle" font-size="25" font-weight="700" fill="#d95516">Không đồng đều</text>
    <rect x="845" y="350" width="260" height="155" rx="20" fill="#ffeadf" stroke="#ea5f1b" stroke-width="5"/>
    <line x1="830" y1="535" x2="1120" y2="535" stroke="#9fb4ca" stroke-width="3"/>
    <text x="975" y="585" text-anchor="middle" font-size="25" font-weight="650" fill="#9a3412">(2, 1, 1)</text>
    <text x="975" y="645" text-anchor="middle" font-size="21" fill="#9a3412">Tỉ lệ bị thay đổi</text>
  </g>

  <rect x="125" y="760" width="950" height="78" rx="20" fill="#ffe9dc" stroke="#f2a36d" stroke-width="2"/>
  <text x="600" y="793" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">Cảnh báo cho quan hệ cha–con</text>
  <text x="600" y="823" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#67402d">Cha đổi kích thước có thể làm khoảng cách toàn cảnh tới con thay đổi.</text>
</svg>
