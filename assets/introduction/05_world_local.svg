<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17233b}.title{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:15px}.xs{font-size:12px}.b{font-weight:700}.muted{fill:#667085}.blue{fill:#2563eb}.green{fill:#16a34a}.red{fill:#dc2626}.purple{fill:#7c3aed}.orange{fill:#ea580c}.axis{stroke-width:4;fill:none}.thin{stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.card{fill:#fff;stroke:#d6dbe6;stroke-width:2}.note{fill:#fff7d6;stroke:#f0c94f;stroke-width:2}</style><rect width="800" height="600" fill="white"/><defs><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#16a34a"/></marker></defs><text x="400" y="45" text-anchor="middle" class="title">World và Local</text><rect x="45" y="85" width="335" height="390" rx="18" class="card"/><rect x="80" y="105" width="265" height="44" rx="10" fill="#2563eb"/><text x="212" y="135" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">World</text><text x="212" y="178" text-anchor="middle" class="s" style="fill:#2563eb">so với toàn cảnh</text><rect x="125" y="275" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#94a3b8"/><rect x="260" y="240" width="45" height="45" fill="#60a5fa" stroke="#1d4ed8"/><text x="282" y="225" text-anchor="middle" class="xs">Child</text><circle cx="100" cy="395" r="6" fill="#2563eb"/><line x1="100" y1="395" x2="282" y2="260" stroke="#2563eb" stroke-width="3" class="dash"/><text x="212" y="400" text-anchor="middle" class="s b" style="fill:#2563eb">world position</text><text x="100" y="420" class="xs">Gốc cảnh</text><rect x="420" y="85" width="335" height="390" rx="18" class="card"/><rect x="455" y="105" width="265" height="44" rx="10" fill="#16a34a"/><text x="587" y="135" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">Local</text><text x="587" y="178" text-anchor="middle" class="s" style="fill:#16a34a">so với đối tượng cha</text><rect x="500" y="275" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#94a3b8"/><rect x="635" y="240" width="45" height="45" fill="#60a5fa" stroke="#1d4ed8"/><text x="657" y="225" text-anchor="middle" class="xs">Child</text><circle cx="540" cy="325" r="6" fill="#16a34a"/><line x1="540" y1="325" x2="657" y2="260" stroke="#16a34a" stroke-width="3" class="dash"/><text x="587" y="400" text-anchor="middle" class="s b" style="fill:#16a34a">local position</text><text x="510" y="350" class="xs">Gốc Parent</text><rect x="145" y="510" width="510" height="64" rx="14" class="note"/><text x="400" y="538" text-anchor="middle" class="s b">Cùng một đối tượng có thể có</text><text x="400" y="562" text-anchor="middle" class="h">world position và local position khác nhau</text></svg>