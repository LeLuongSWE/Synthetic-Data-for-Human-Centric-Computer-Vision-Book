name: Build and publish book

on:
  push:
    branches:
      - main
    paths:
      - chapters/**
      - assets/**
      - code/**
      - docs/book-architecture.md
      - scripts/prepare_docs.py
      - index.md
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/publish-book.yml
  pull_request:
    paths:
      - chapters/**
      - assets/**
      - code/**
      - docs/book-architecture.md
      - scripts/prepare_docs.py
      - index.md
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/publish-book.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Prepare documentation source
        run: python scripts/prepare_docs.py

      - name: Build book
        run: mkdocs build --strict --site-dir "${RUNNER_TEMP}/book-site"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/book-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
